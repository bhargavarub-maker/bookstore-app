spring.application.name=bookstore
server.port=8080

# ---- Database: H2 in memory (default) ----
# Runs inside the app, nothing to install. Data resets every time the app restarts.
spring.datasource.url=jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Browse the tables at http://localhost:8080/h2-console (JDBC URL above, user sa, empty password)
spring.h2.console.enabled=true

# Create/update tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Set to true to print every SQL statement in the console
spring.jpa.show-sql=false

# ---- HTTP Basic authentication for /v1/** (see SecurityConfig.java) ----
# Change these with the BOOKSTORE_USER / BOOKSTORE_PASSWORD environment variables,
# and always set a new password when the app is reachable from the internet (e.g. Cloud Run).
spring.security.user.name=${BOOKSTORE_USER:student}
spring.security.user.password=${BOOKSTORE_PASSWORD:bookstore123}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Remember the Authorize login when the Swagger page is reloaded
springdoc.swagger-ui.persist-authorization=true
