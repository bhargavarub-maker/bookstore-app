# Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Override any value with environment variables, e.g. DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
spring.datasource.username=${DB_USER:bookstore}
spring.datasource.password=${DB_PASSWORD:bookstore}
spring.h2.console.enabled=false
