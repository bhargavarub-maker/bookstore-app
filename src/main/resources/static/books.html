<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage books · Bookstore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <div class="page-head">
    <div>
      <h1>Manage books</h1>
      <p class="muted" style="margin:0">Add, edit and delete books in the catalog.</p>
    </div>
    <button class="btn" id="add-book">+ Add book</button>
  </div>

  <div class="card table-wrap" style="margin-bottom:40px">
    <table>
      <thead><tr><th>#</th><th>Title</th><th>Author</th><th>Genre</th><th class="num">Price</th><th class="num">Stock</th><th></th></tr></thead>
      <tbody id="books"></tbody>
    </table>
  </div>
</main>

<!-- One form for both "add" (POST) and "edit" (PUT) -->
<dialog id="book-dialog">
  <form id="book-form" method="dialog">
    <h2 class="full" id="book-dialog-title" style="margin:0">Add a book</h2>
    <input type="hidden" id="book-id">
    <label class="field full">Title <input id="book-title" required></label>
    <label class="field full">Author <input id="book-author" required></label>
    <label class="field">Genre <input id="book-genre" placeholder="e.g. scifi"></label>
    <label class="field">Price ($) <input id="book-price" type="number" step="0.01" min="0" required></label>
    <label class="field">Stock <input id="book-stock" type="number" step="1" min="0" required></label>
    <div id="book-error" class="form-error full hidden"></div>
    <div class="buttons">
      <button type="button" class="btn light" id="book-cancel">Cancel</button>
      <button class="btn" id="book-save">Save</button>
    </div>
  </form>
</dialog>
<script src="common.js"></script>
<script src="books.js"></script>
</body>
</html>
